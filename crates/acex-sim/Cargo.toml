[package]
name = "acex-sim"
version = "0.5.3"
edition = "2024"
authors = ["Samuel Preston <samp.reston@outlook.com>", "MRW <171420035+MRWGNRRR@users.noreply.github.com>"]
description = "Deterministic simulation infrastructure. Everything needed to test protocol state machines reproducibly."
readme = "README.md"
repository = "https://github.com/MRWGNRRR/acex"
license = "MIT or Apache-2.0"
keywords = ["diagnostics", "vehicle", "standards"]
categories = ["development-tools", "network-programming", "automotive"]

[features]
default = []
alloc = ["acex-core/alloc"]
std = ["alloc", "acex-core/std"]

[dependencies]
acex-core = { workspace = true }
