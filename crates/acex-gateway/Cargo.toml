[package]
name = "acex-gateway"
version = "0.5.3"
edition = "2024"
authors = ["Samuel Preston <samp.reston@outlook.com>", "MRW <171420035+MRWGNRRR@users.noreply.github.com>"]
description = "DoIP Gateway, ISO-TP bridge node, and DoIP Tester"
readme = "README.md"
repository = "https://github.com/MRWGNRRR/acex"
license = "MIT or Apache-2.0"
keywords = ["diagnostics", "vehicle", "standards"]
categories = ["development-tools", "network-programming", "automotive"]

[features]
default = []
alloc = [
	"acex-doip/alloc",
	"acex-can/alloc",
	"acex-proto/alloc",
	"acex-core/alloc",
	"acex-macros/alloc",
	"acex-client/alloc",
	"acex-server/alloc",
	"acex-sim/alloc",
]
defmt = [
	"dep:defmt",
	"acex-sim/defmt",
	"acex-doip/defmt",
	"acex-can/defmt",
	"acex-proto/defmt",
	"acex-core/defmt",
	"acex-macros/defmt",
	"acex-client/defmt",
	"acex-server/defmt"
]

[dependencies]
acex-sim = { workspace = true }
acex-doip = { workspace = true }
acex-can = { workspace = true }
acex-proto = { workspace = true }
acex-core = { workspace = true }
acex-macros = { workspace = true }
acex-client = { workspace = true }
acex-server = { workspace = true }
defmt = { workspace = true, optional = true }